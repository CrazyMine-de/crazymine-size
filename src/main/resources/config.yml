# ==============================================================================
# CrazyMine Size — Konfiguration
# GitHub: https://github.com/CrazyMine-de/crazymine-size
# ==============================================================================

# Ist das Größen-System aktiv?
enabled: true

# Erfordern die Presets (klein, gross usw.) extra LuckPerms-Permissions?
# Falls false, kann jeder Spieler mit crazymine.size.use alle Presets frei wählen.
require-permission: true

# Mindest- und Maximalgröße (Standard: 0.2x bis 2.5x)
# Spieler mit der Permission 'crazymine.size.bypass' können diesen Rahmen überschreiten.
min-scale: 0.2
max-scale: 2.5

# Server-weite Standard-Größe (Standard: 1.0)
# Wenn force-server-scale true ist, haben alle Spieler beim Beitreten fest diese Größe.
server-scale: 1.0
force-server-scale: false

# Speicherung der Spielergröße (über Reconnects und Server-Neustarts hinweg)
storage:
  persist: true
  # Optionaler benutzerdefinierter Pfad (z.B. für Proxy-/Netzwerk-Server, z.B. /opt/nimbus/shared/sizes/sizes.yml).
  # Leer lassen (""), um die Standarddatei im Plugin-Ordner (plugins/CrazyMineSize/sizes.yml) zu nutzen.
  custom-file-path: ""

# Grafische Benutzeroberfläche (GUI)
gui:
  # Inventargröße (muss ein Vielfaches von 9 sein: 9, 18, 27, 36, 45, 54)
  size: 27
  filler:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
  info-item:
    enabled: true
    slot: 4
    material: "COMPASS"
  reset-item:
    enabled: true
    slot: 26
    material: "REDSTONE"

# Sound- und Partikeleffekte beim Ändern der Größe
effects:
  sounds:
    enabled: true
    change-scale: "ENTITY_PLAYER_LEVELUP"
    gui-open: "BLOCK_ENCHANTMENT_TABLE_USE"
    gui-denied: "ENTITY_VILLAGER_NO"
  particles:
    enabled: true
    particle: "ENCHANT"
    count: 25

# Presets für das GUI und den Befehl (/size <name>)
# Jeder Eintrag kann frei angepasst oder erweitert werden.
presets:
  klein:
    scale: 0.5
    title: "<gradient:#38bdf8:#818cf8><bold>Klein</bold></gradient>"
    description: "<gray>Schrumpfe auf halbe Größe (0.5x)</gray>"
    permission: "crazymine.size.small"
    material: "BABY_TURTLE_SPAWN_EGG"
    slot: 11
  normal:
    scale: 1.0
    title: "<green><bold>Normal</bold></green>"
    description: "<gray>Standard-Größe eines Spielers (1.0x)</gray>"
    permission: "crazymine.size.normal"
    material: "PLAYER_HEAD"
    slot: 13
  etwasgross:
    scale: 1.3
    title: "<gradient:#f59e0b:#ef4444><bold>Etwas größer</bold></gradient>"
    description: "<gray>Werde ein Stückchen größer (1.3x)</gray>"
    permission: "crazymine.size.large"
    material: "GOLDEN_APPLE"
    slot: 15
  gross:
    scale: 1.6
    title: "<gradient:#dc2626:#7c2d12><bold>Groß</bold></gradient>"
    description: "<gray>Wachse zu einem echten Riesen heran (1.6x)</gray>"
    permission: "crazymine.size.large"
    material: "IRON_GOLEM_SPAWN_EGG"
    slot: 22
